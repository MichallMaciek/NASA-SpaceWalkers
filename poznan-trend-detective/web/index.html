<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SARnik: radarowy przegląd terenu</title>
<meta name="description" content="SARnik: a radar check-up for any piece of land around Poznań. NISAR and Sentinel-1 radar passes of 2026, how the ground reacts to wet weather, ground motion from InSAR, L-band history from ALOS, plus 50 years of building growth and a projection to 2035.">
<meta property="og:title" content="SARnik: radarowy przegląd terenu przed zakupem">
<meta property="og:description" content="Wpisz adres lub obrysuj działkę: co radar NISAR i Sentinel-1 widzi tu w 2026, czy grunt nasiąka wodą, czy osiada, ile tu zbudowano od 1975 i co prognoza mówi na 2035. NASA Space Apps 2026, Dancing with the SARs.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F1F0EB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23F1F0EB%27/%3E%3Cpath d=%27M7 25a13 13 0 0 1 18-18%27 fill=%27none%27 stroke=%27%237357E8%27 stroke-width=%272.4%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M11 25a9 9 0 0 1 14-14%27 fill=%27none%27 stroke=%27%237357E8%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 opacity=%27.6%27/%3E%3Ccircle cx=%2721%27 cy=%2721%27 r=%275%27 fill=%27%23F2A31B%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css?v=1794690000">
</head>
<body>
<div id="map" aria-label="Map"></div>

<!-- top left: search + drawing tools -->
<div class="topbar">
  <div class="search card">
    <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
    <label for="q" class="sr" data-i18n="searchLabel">Search an address</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="searchPh">
    <ul class="suggest card" id="suggest" role="listbox" hidden></ul>
  </div>
  <div class="tools card" role="toolbar" data-i18n-aria="tools">
    <button type="button" class="tool" id="tool-free" data-i18n-title="drawFree" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.6 3.4l3 3L7 16H4v-3z"/><path d="M11.8 5.2l3 3"/></svg>
    </button>
    <button type="button" class="tool" id="tool-poly" data-i18n-title="drawPoly" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8l7 5.1-2.7 8.3H5.7L3 7.9z"/></svg>
    </button>
    <span class="tools-sep" aria-hidden="true"></span>
    <button type="button" class="tool" id="tool-clear" data-i18n-title="clearArea" disabled>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l.8 10h6.4L14 6"/></svg>
    </button>
  </div>
  <nav class="lenses card" id="lenses" data-i18n-aria="lensBar"></nav>
</div>

<!-- card under the search: findings, or the selected place / area -->
<section class="sidecard card" id="sidecard" aria-live="polite"></section>

<!-- drawing hint -->
<div class="drawhint card" id="drawhint" hidden>
  <span id="drawhint-text"></span><kbd>Esc</kbd>
</div>

<!-- top right: settings + zoom -->
<div class="topright">
  <button type="button" class="iconbtn card" id="menu-btn" aria-expanded="false" aria-controls="drawer" data-i18n-title="settings">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>
  </button>
  <button type="button" class="iconbtn card" id="radar-btn" data-i18n-title="radarHow">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16a12 12 0 0 1 12-12"/><path d="M7 16a9 9 0 0 1 9-9" opacity=".7"/><path d="M10 16a6 6 0 0 1 6-6" opacity=".45"/><circle cx="15" cy="15" r="1.6"/></svg>
  </button>
  <button type="button" class="iconbtn card" id="theme-btn" data-i18n-title="themeToggle">
    <svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1z"/></svg>
    <svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
  </button>
  <div class="zoom card">
    <button type="button" id="zoom-in" data-i18n-title="zoomIn"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg></button>
    <button type="button" id="zoom-out" data-i18n-title="zoomOut"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10h11"/></svg></button>
  </div>
</div>

<!-- right drawer: map settings -->
<aside class="drawer" id="drawer" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <h2 id="drawer-title" data-i18n="settings">Map settings</h2>
    <div class="drawer-actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="pl" aria-pressed="true">PL</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="x" id="drawer-close" data-i18n-aria="close">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<!-- bottom left legend -->
<div class="legend card" id="legend"></div>

<!-- bottom timeline -->
<div class="timeline card" id="timeline">
  <button type="button" class="playbtn" id="play" data-i18n-aria="play">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path class="i-play" d="M7 5l8 5-8 5z"/><path class="i-pause" d="M6 4.5h3v11H6zM11 4.5h3v11h-3z"/></svg>
  </button>
  <div class="tl-year">
    <div class="tl-big" id="tl-year">2020</div>
    <div class="tl-kind" id="tl-kind"></div>
  </div>
  <div class="tl-track" id="tl-track">
    <div class="tl-labels"><span id="tl-real"></span><span class="tl-pred" id="tl-pred"></span></div>
    <div class="tl-rail" id="tl-rail">
      <div class="tl-fill" id="tl-fill"></div>
      <div class="tl-future" id="tl-future"></div>
      <div class="tl-now" id="tl-now"></div>
      <input type="range" id="year" min="1975" max="2035" step="0.1" value="2020" data-i18n-aria="year">
    </div>
    <div class="tl-ticks" id="tl-ticks"></div>
  </div>
</div>

<dialog class="sheet" id="test-sheet" aria-labelledby="test-title">
  <div class="sheet-head">
    <h2 id="test-title"></h2>
    <button type="button" class="x" id="test-close" data-i18n-aria="close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <div class="sheet-body">
    <div class="seg" id="vartabs" role="tablist"></div>
    <figure class="chart" id="test-chart"></figure>
    <p class="verdictline" id="test-verdict"></p>
    <dl class="stats" id="test-stats"></dl>
    <details class="howto">
      <summary data-i18n="howTitle">How to read this test</summary>
      <p data-i18n="how1"></p>
      <p data-i18n="how2"></p>
    </details>
    <details>
      <summary data-i18n="numbers">Show the numbers</summary>
      <div class="datatable" id="test-table"></div>
    </details>
  </div>
</dialog>

<dialog class="sheet" id="radar-sheet" aria-labelledby="radar-title">
  <div class="sheet-head">
    <h2 id="radar-title" data-i18n="radarHow">How radar sees the ground</h2>
    <button type="button" class="x" id="radar-close" data-i18n-aria="close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <div class="sheet-body about radar-how" id="radar-body"></div>
</dialog>

<dialog class="sheet" id="about-sheet" aria-labelledby="about-title">
  <div class="sheet-head">
    <h2 id="about-title" data-i18n="about">About the data</h2>
    <button type="button" class="x" id="about-close" data-i18n-aria="close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>
  <div class="sheet-body about" id="about-body"></div>
</dialog>

<div class="hovertip card" id="hovertip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="i18n.js?v=1794690000"></script>
<script src="i18n_sar.js?v=1794690000"></script>
<script src="sarnik/manifest.js?v=1794690000"></script>
<script src="app.js?v=1794690000"></script>
</body>
</html>
